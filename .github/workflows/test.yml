name: Tests

on:
  # PRs into develop / production: the gate before merging. ready_for_review starts a run when a draft is marked ready.
  pull_request:
    branches: [develop, production]
    types: [opened, synchronize, reopened, ready_for_review]
  # After a merge: catches two PRs that pass alone but break together.
  push:
    branches: [develop, production]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Playwright)
    # Draft PRs skip the run (a skipped job doesn't block a required check, and drafts can't be merged anyway).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: .next-e2e/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.mjs') }}
          restore-keys: next-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run e2e:build

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
          # Both folders start with a dot; upload-artifact skips hidden paths unless told otherwise.
          include-hidden-files: true
          retention-days: 14
