<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport" />
    <title>Cargo Navis</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 0 32px;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f6f7;
        color: #1f2937;
      }
      svg {
        color: #cc1313;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: #6b7280;
      }
      button {
        margin-top: 8px;
        min-height: 44px;
        padding: 0 20px;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        background: #ffffff;
        color: inherit;
        font: inherit;
        font-size: 15px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1a1b21;
          color: #f3f4f6;
        }
        p {
          color: #9ca3af;
        }
        svg {
          color: #ff4d4d;
        }
        button {
          border-color: #3f3f46;
          background: #212126;
        }
      }
    </style>
  </head>
  <body>
    <!-- Tabler wifi-off, red-500 / red-300 like the app's error screens -->
    <svg
      aria-hidden="true"
      fill="none"
      height="36"
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="1.5"
      viewBox="0 0 24 24"
      width="36"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path d="M0 0h24v24H0z" fill="none" stroke="none" />
      <path d="M12 18l.01 0" />
      <path d="M9.172 15.172a4 4 0 0 1 5.656 0" />
      <path d="M6.343 12.343a7.963 7.963 0 0 1 3.864 -2.14m4.163 .155a7.965 7.965 0 0 1 3.287 2" />
      <path d="M3.515 9.515a12 12 0 0 1 3.544 -2.455m3.101 -.92a12 12 0 0 1 10.325 3.374" />
      <path d="M3 3l18 18" />
    </svg>
    <h1>Nema internetske veze</h1>
    <p>Provjeri vezu i pokušaj ponovno.</p>
    <button onclick="location.reload()" type="button">Pokušaj ponovno</button>
  </body>
</html>
